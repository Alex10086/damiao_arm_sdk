# Damiao 6-Axis Robotic Arm Configuration
joint_count: 6
has_gripper: false
# UNCALIBRATED: all pos_min/pos_max below are provisional defaults,
# not measured mechanical limits. Manually calibrate before control.
can_interface: vcan0
enable_fd: false
state_timeout_ms: 500
# Require periodic control writes; read-only refresh queries do not feed the motor watchdog.
command_timeout_ms: 100
# RID 9 raw units: 50 us/tick on the verified motors, 2000 ticks = 100 ms.
# Pure C++ callers must apply this with configureMotorTimeout() while DISARMED.
motor_timeout_reg: 2000
recv_timeout_us: 1000

joints:
  - name: joint1
    motor_type: DM4310
    send_can_id: 0x01
    recv_can_id: 0x11
    control_mode: MIT
    pos_min: -3.1416
    pos_max: 3.1416
    vel_max: 30.0
    tau_max: 10.0
    kp_max: 500.0
    kd_max: 5.0

  - name: joint2
    motor_type: DM4310
    send_can_id: 0x02
    recv_can_id: 0x12
    control_mode: MIT
